<!doctype html>
<html>
  <head>
    <base target="_blank" />
    <meta charset="utf-8" />
    <title>Taiwan + Singapore Playbook</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #1c1914;
        --muted: #5c564e;
        --quiet: #5c564e;
        --past: #5c564e;
        --rule: #b0a694;
        --page: #f6f1e6;
        --amber: #7a4a08;
        --now-ink: #f6f1e6;
        --rail: 104px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body {

        background: var(--page);
        overflow-x: clip;
        overscroll-behavior-x: none;
      }
      body {

        font-family: -apple-system, system-ui, sans-serif;
        font-size: 16px;
        line-height: 22px;
        letter-spacing: 0;
        -webkit-text-size-adjust: 100%;
      }
      button, a, select {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        text-align: left;
        text-decoration: none;
      }
      button, a, summary { -webkit-tap-highlight-color: transparent; }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      button:active, a:active, summary:active { background: rgba(28, 25, 20, 0.06); }
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--page);
        padding-top: env(safe-area-inset-top);
      }
      .top, .days, .meter, main { padding-left: 16px; padding-right: 16px; }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 52px;
        padding-top: 8px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        line-height: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .clock {
        margin-top: 1px;
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0;
      }
      .all, .nav, .daysel, .refresh {
        min-width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }
      .all { justify-content: flex-end; padding: 0 2px; font-size: 16px; }
      .days { display: flex; align-items: center; min-width: 0; }
      .nav { width: 44px; height: 44px; font-size: 26px; line-height: 1; flex: 0 0 44px; }
      .nav:disabled { opacity: 0.3; }

        flex: 1;
        min-width: 0;
        width: 100%;
        height: 44px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.015em;
        text-align: center;
        text-align-last: center;
        border-radius: 0;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 8px;
      }
      .prog { flex: 1; height: 3px; background: var(--rule); }
      .prog i { display: block; height: 100%; background: var(--ink); }
      .pn {
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .dayhead, .stay, .nowbox {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) 44px;
        column-gap: 8px;
      }
      .dayhead { align-items: center; padding-top: 16px; }
      .dnum {
        grid-column: 1;
        grid-row: 1;
        text-align: left;
        font-size: 56px;
        line-height: 0.8;
        font-weight: 700;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
      }
      .dtop {
        grid-column: 2 / -1;
        grid-row: 1;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
      }
      .areas {
        grid-column: 1 / -1;
        margin-top: 8px;
        font-size: 16px;
        line-height: 22px;
        font-weight: 500;
        overflow-wrap: break-word;
      }
      .alarm {
        grid-column: 1 / -1;
        margin-top: 8px;
        font-size: 13px;
        line-height: 18px;
        font-weight: 400;
      }
      .al { color: var(--muted); font-weight: 400; }
      .big {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 15px;
        line-height: 22px;
        font-weight: 500;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        color: var(--amber);
      }
      .em {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-style: normal;
        margin-right: 4px;
        vertical-align: -0.125em;
      }
      .stay { margin-top: 8px; }
      .rowlink, .exp, .idea {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        min-height: 44px;
        padding: 8px 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 500;
      }
      .rowlink .name, .exp .name, .idea .name { flex: 1; min-width: 0; overflow-wrap: break-word; }
      .rowlink .go, .idea .go, .exp .chev { margin-left: auto; flex: 0 0 auto; }
      .go { display: inline-block; min-width: 16px; text-align: right; font-weight: 500; }
      .pl .go { float: right; margin: 1px 8px 0 8px; }
      .hnote { display: block; margin-top: 2px; font-weight: 500; color: var(--muted); }
      .nowbox { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }

        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) 44px;
        column-gap: 8px;
        grid-column: 1 / -1;
        align-items: start;
        width: 100%;
        min-height: 44px;
        text-align: left;

        min-width: 0;
        padding: 11px 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        overflow-wrap: break-word;
      }

        display: flex;
        flex-wrap: wrap;
        align-items: center;
        border-bottom: 1px solid var(--rule);
      }
      .fchip {
        min-width: 44px;
        min-height: 44px;
        padding: 0 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        letter-spacing: 0;
        position: relative;

      .fchip.on { color: var(--ink); font-weight: 600; }

        content: "";

        left: 6px;
        right: 6px;
        bottom: 0;
        height: 2px;
        background: var(--ink);
      }
      summary {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 44px;
        padding: 8px 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker { display: none; }
      summary .chev { margin-left: auto; }
      .chev {
        width: 8px;
        height: 8px;
        margin-right: 4px;
        border-top: 2px solid currentColor;
        border-right: 2px solid currentColor;
        transform: rotate(45deg);
        flex: 0 0 auto;
      }
      details[open] > summary .chev, .exp.open .chev { transform: rotate(135deg); }

        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        column-gap: 8px;
        align-items: start;
        width: 100%;
        min-height: 44px;
        border-top: 1px solid var(--rule);
        text-align: left;
      }
      .crow .on {
        min-width: 0;
        padding: 11px 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 500;
        overflow-wrap: break-word;
      }
      .plan { border-top: 1px solid var(--rule); }
      .row {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr) 44px;
        column-gap: 8px;
        align-items: start;
        border-bottom: 1px solid var(--rule);
        min-width: 0;

      .when {

        grid-row: 1;
        align-self: start;
        padding-top: 11px;
        text-align: right;

        font-weight: 500;
        font-size: 12px;
        line-height: 22px;
        letter-spacing: 0;
        color: var(--amber);

      .when .frag { white-space: nowrap; }
      .when .flex { color: var(--muted); font-weight: 500; }
      .ttl { grid-column: 2; grid-row: 1; min-width: 0; align-self: start; }
      .pl {
        display: block;
        min-height: 44px;
        min-width: 44px;
        padding: 11px 0 4px;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        overflow-wrap: break-word;
      }
      .done {
        grid-column: 3;
        grid-row: 1;
        align-self: start;
        justify-self: start;
        position: relative;
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
      }
      .done::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 13px;
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--quiet);
        background: transparent;
      }
      .done[aria-pressed="true"]::before { background: var(--ink); border-color: var(--ink); }

        content: "";

        left: 17px;
        top: 18px;
        width: 10px;
        height: 6px;
        border-left: 2px solid var(--page);
        border-bottom: 2px solid var(--page);
        transform: rotate(-45deg);

        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 0 0 8px;

        line-height: 18px;
        font-weight: 500;
        color: var(--muted);
        white-space: nowrap;

        align-items: center;
        height: 18px;
        padding: 0 5px;
        font-size: 11px;
        line-height: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;

        min-width: 44px;

        color: var(--ink);
        font-size: 13px;
        line-height: 18px;
        font-weight: 600;

        line-height: 18px;
        font-weight: 600;
        letter-spacing: 0;

        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0 8px;
        vertical-align: middle;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 4px;
        padding-bottom: env(safe-area-inset-bottom);
        font-size: 13px;
        line-height: 18px;
        color: var(--muted);

      .foot span { overflow-wrap: anywhere; }
      .refresh { font-size: 16px; color: var(--ink); flex: 0 0 auto; }

      .late .lh { font-weight: 600; color: var(--ink); padding: 8px 0; }

      .late .warn { color: var(--ink); }

        min-width: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 1px solid var(--ink);
        color: var(--ink);
        font-size: 13px;
        line-height: 18px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .vtabs { display: flex; border-bottom: 1px solid var(--rule); }
      .vtabs .fchip { flex: 1; }

        flex-wrap: wrap;
        align-items: center;

        width: 100%;
        min-height: 44px;
        padding: 11px 0;
        border-bottom: 1px solid var(--rule);
        text-align: left;

        main *, .row.flash { animation: none !important; }
      }
    </style>
  </head>
