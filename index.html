<!doctype html>
<html>
  <head>
    <base target="_blank" />
    <meta charset="utf-8" />
    <title>Taiwan + Singapore Playbook</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <style>
@keyframes flash {
        from {
          background-color: var(--soft);
        }
        to {
          background-color: transparent;
        }
      }
      @keyframes ink {
        from {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0;
        }
        to {
          transform: translate(-50%, -50%);
          opacity: 1;
        }
      }
      :root {
        --paper: #f6f0e4;
        --ink: #1b140f;
        --carbon: #0f3d4c;
        --chop: #b42318;
        --mut: #5c5348;
        --past: #6e665b;
        --rule: #e0d5c5;
        --soft: #efe6d6;
        --col: 720px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--paper);
        overflow-x: clip;
        overscroll-behavior-x: none;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang TC",
          "Noto Sans TC",
          sans-serif;
        letter-spacing: -0.006em;
        overflow-x: clip;
        overscroll-behavior-x: none;
        -webkit-text-size-adjust: 100%;
      }
      a {
        color: var(--carbon);
        text-decoration: none;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      :focus-visible {
        outline: 2px solid var(--chop);
        outline-offset: 2px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--paper);
        padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
        border-bottom: 1px solid var(--rule);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .top h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.011em;
      }
      .clock {
        margin-top: 2px;
        font-size: 13px;
        line-height: 1.2;
        color: var(--mut);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }
      .hbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0 4px;
        font-size: 16px;
        font-weight: 600;
        color: var(--carbon);
      }
      .days {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav {
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        font-size: 24px;
        line-height: 44px;
        text-align: center;
        color: var(--ink);
      }
      .nav:disabled {
        opacity: 0.3;
        cursor: default;
      }
      #daysel {
        flex: 1;
        min-width: 0;
        height: 44px;
        padding: 0 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.011em;
      }
      .dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .prog {
        flex: 1;
        height: 3px;
        background: var(--rule);
        overflow: hidden;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--ink);
      }
      .pn {
        font-size: 13px;
        color: var(--mut);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
        white-space: nowrap;
      }
      main {
        padding: 0 12px calc(env(safe-area-inset-bottom) + 24px);
        max-width: var(--col);
        margin: 0 auto;
      }
      .spread {
        display: flex;
        flex-direction: column;
      }
      .rail,
      .sheet {
        display: contents;
      }
      .dayhead {
        order: 1;
      }
      .nowbox {
        order: 2;
      }
      .filters {
        order: 3;
      }
      #ov {
        order: 4;
      }
      #plan {
        order: 5;
      }
      .loose {
        order: 6;
      }
      .kath {
        order: 7;
      }
      .foot {
        order: 8;
      }
      @media (min-width: 800px) {
        header {
          padding-left: 0;
          padding-right: 0;
        }
        header .top,
        header .days,
        header .dots,
        main {
          box-sizing: border-box;
          width: 100%;
          max-width: 960px;
          margin-left: auto;
          margin-right: auto;
          padding-left: 48px;
          padding-right: 48px;
        }
        main {
          padding-bottom: 48px;
        }
        .spread {
          display: grid;
          grid-template-columns: 240px minmax(0, 1fr);
          column-gap: 40px;
          align-items: start;
        }
        .rail,
        .sheet {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          min-width: 0;
          order: 0;
        }
        .rail {
          position: sticky;
          top: 128px;
          align-self: start;
        }
        .spread {
          background-image: linear-gradient(var(--rule), var(--rule));
          background-repeat: no-repeat;
          background-size: 1px 100%;
          background-position: 260px 0;
        }
        .dayhead,
        .nowbox,
        .filters,
        #ov,
        #plan,
        .loose,
        .kath,
        .foot {
          order: 0;
        }
      }
      .dayhead h2 {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas: "num meta" "num area";
        column-gap: 12px;
        row-gap: 2px;
        align-items: end;
        margin: 12px 0 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.011em;
      }
      .dnum {
        grid-area: num;
        width: 2ch;
        text-align: right;
        font-size: 56px;
        line-height: 0.8;
        font-weight: 700;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
      }
      .dmeta {
        grid-area: meta;
        align-self: end;
      }
      .area {
        grid-area: area;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .alarm {
        margin: 8px 0 0;
        font-size: 16px;
        line-height: 1.3;
      }
      .alarm .al {
        color: var(--mut);
        font-weight: 600;
      }
      .alarm .big {
        font-weight: 700;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }
      .stay {
        margin: 8px 0 0;
        border-top: 1px solid var(--rule);
      }
      .stay .arow {
        border-bottom: 1px solid var(--rule);
        font-size: 16px;
        font-weight: 600;
        line-height: 1.35;
      }
      .stay .arow a {
        display: block;
        min-height: 44px;
        padding: 11px 0;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        line-height: 22px;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }
      .stay .arow a::after {
        content: "↗";
        margin-left: 12px;
        color: var(--carbon);
        font-weight: 500;
      }
      .stay .hnote {
        display: block;
        margin-top: 2px;
        font-size: 16px;
        font-weight: 500;
        color: var(--mut);
      }
      .stay .dayof,
      .stay .dl,
      .dayof,
      .dl {
        margin: 0;
        padding: 8px 0;
        font-size: 16px;
        line-height: 1.4;
        color: var(--mut);
        overflow-wrap: anywhere;
      }
      .dayof a,
      .dl a,
      .sub a,
      .trv a,
      .note a,
      .det a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        min-width: 44px;
        color: var(--carbon);
        font-weight: 600;
      }
      .hconf {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 0;
      }
      .nowbox {
        margin: 8px 0;
        padding: 4px 0;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .nls {
        min-width: 0;
      }
      .nl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        column-gap: 12px;
        align-items: baseline;
        min-height: 44px;
        cursor: pointer;
      }
      .nt {
        min-width: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 22px;
      }
      .flag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 18px;
        padding: 1px 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 16px;
      }
      .flag.now {
        background: var(--chop);
        color: #fff;
      }
      .flag.nx {
        color: var(--ink);
        box-shadow: none;
        padding-left: 0;
        padding-right: 0;
      }
      #latebtn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 44px;
        margin-top: 4px;
        padding: 8px 0;
        background: transparent;
        color: var(--ink);
        font-weight: 600;
      }
      #latebtn::after,
      .act[aria-expanded]::after,
      #ov summary::after,
      .kath summary::after {
        content: "";
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        margin-left: 12px;
        box-sizing: border-box;
        border-right: 2px solid var(--ink);
        border-bottom: 2px solid var(--ink);
        transform: rotate(-45deg);
      }
      #latebtn[aria-pressed="true"]::after,
      .act[aria-expanded="true"]::after,
      #ov[open] > summary::after,
      .kath[open] > summary::after {
        transform: rotate(45deg);
      }
      .filters,
      .vtabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0 4px;
        padding: 4px 0;
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 1 auto;
        min-width: 44px;
        min-height: 44px;
        padding: 0 8px;
        border: 0;
        background: transparent;
        color: var(--mut);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
        text-align: center;
        white-space: nowrap;
      }
      .filters .fchip {
        width: auto;
        justify-content: flex-start;
        padding-left: 0;
        padding-right: 12px;
      }
      .fchip[aria-pressed="true"] {
        background: transparent;
        color: var(--ink);
        box-shadow: inset 0 -2px 0 var(--ink);
      }
      #ov,
      #trip,
      #res {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        column-gap: 12px;
      }
      #ov {
        margin: 0;
        border-bottom: 1px solid var(--rule);
      }
      #ov > summary,
      .kath summary {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 8px 0;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::marker {
        content: none;
      }
      #ov .ovr,
      #trip .ovr {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1 / -1;
        align-items: baseline;
        width: 100%;
        min-height: 44px;
        padding: 8px 0;
        border-top: 1px solid var(--rule);
        background: transparent;
        text-align: left;
      }
      #trip .ovr {
        border-top: 0;
        border-bottom: 1px solid var(--rule);
      }
      .ot,
      .rd,
      .tm {
        font-size: 13px;
        line-height: 22px;
        font-weight: 700;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
        white-space: nowrap;
        justify-self: end;
        text-align: right;
      }
      .tm.flex {
        font-weight: 500;
        color: var(--mut);
      }
      .on,
      .nt,
      .bi {
        min-width: 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .oa,
      .on2 {
        grid-column: 1 / -1;
        font-size: 13px;
        line-height: 1.35;
        color: var(--mut);
        text-align: left;
        white-space: normal;
      }
      .ovr.past .on,
      .card.past .ttl,
      .card.past .mk,
      .card.past .pl,
      .card.past .tm,
      .card.past .tag,
      .card.past .ok,
      .card.past .sub,
      .card.past .trv,
      .card.past .act {
        color: var(--past);
        font-weight: 400;
      }
      .card.past .chip {
        color: var(--past);
        border-color: var(--past);
      }
      .ovr.now .ot,
      .ovr.nx .ot {
        font-weight: 700;
      }
      #plan {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) 44px;
        column-gap: 12px;
        margin: 4px 0 0;
        border-top: 1px solid var(--rule);
      }
      .card {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1 / -1;
        align-items: start;
        position: relative;
        padding: 4px 0;
        border-bottom: 1px solid var(--rule);
        background: transparent;
        min-width: 0;
      }
      .card.now .gut::before,
      .card.nx .gut::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 4px;
        bottom: 4px;
        width: 3px;
      }
      .card.now .gut::before {
        background: var(--chop);
      }
      .card.nx .gut::before {
        background: var(--ink);
        width: 1px;
      }
      .gut {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        min-width: 0;
        text-align: right;
      }
      .gut .tm {
        display: block;
        padding-top: 14px;
      }
      .bd {
        min-width: 0;
      }
      .r2 {
        margin: 0;
        min-width: 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        letter-spacing: -0.011em;
      }
      .r1 .flag {
        margin-right: 4px;
      }
      .mk {
        display: inline-block;
        min-width: 1.25em;
        text-align: center;
        line-height: 22px;
        vertical-align: baseline;
      }
      .pl {
        color: var(--ink);
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .card.now .ttl {
        font-weight: 700;
      }
      a.pl,
      span.pl {
        display: inline-block;
        max-width: 100%;
        min-height: 44px;
        min-width: 44px;
        padding: 11px 0;
        line-height: 22px;
      }
      a.pl::after {
        content: " ↗";
        color: var(--carbon);
        font-weight: 500;
      }
      a.pl:active {
        text-decoration: underline;
      }
      .r1 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        margin-top: 4px;
        min-width: 0;
      }
      .tag {
        padding: 0;
        background: transparent;
        box-shadow: none;
        font-size: 13px;
        font-weight: 600;
        line-height: 18px;
        letter-spacing: 0;
        color: var(--carbon);
        white-space: nowrap;
      }
      .t-food,
      .t-coffee,
      .t-sights,
      .t-photo,
      .t-transport,
      .t-hotel {
        color: var(--mut);
      }
      .t-meal {
        color: var(--ink);
      }
      .ok {
        font-size: 13px;
        font-weight: 600;
        color: var(--carbon);
        white-space: nowrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        align-self: center;
        box-sizing: border-box;
        width: fit-content;
        max-width: 100%;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--carbon);
        background: transparent;
        color: var(--carbon);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0;
        text-decoration: none;
        white-space: normal;
      }
      .r1 .chip {
        flex: 0 1 auto;
        justify-content: flex-start;
      }
      .sub,
      .trv {
        margin: 4px 0 0;
        font-size: 16px;
        line-height: 1.4;
        color: var(--mut);
        overflow-wrap: anywhere;
      }
      .acts {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        margin-top: 4px;
        min-width: 0;
      }
      .act {
        min-height: 44px;
        font-size: 16px;
        font-weight: 600;
      }
      a.act.sec,
      .act[aria-expanded] {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        width: 100%;
        box-sizing: border-box;
        min-height: 44px;
        padding: 8px 0;
        background: transparent;
        color: var(--mut);
        font-weight: 600;
        white-space: normal;
        text-decoration: none;
      }
      a.act.sec::after {
        content: "↗";
        margin-left: 12px;
        flex: 0 0 auto;
        color: var(--carbon);
        font-weight: 500;
      }
      .act[aria-expanded]::after {
        margin-left: auto;
      }
      .panel {
        margin-top: 4px;
        padding: 4px 0 8px;
        background: transparent;
        font-size: 16px;
        line-height: 1.4;
      }
      .det div {
        color: var(--mut);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .det div + div {
        margin-top: 8px;
      }
      .ia {
        margin: 8px 0 4px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--mut);
      }
      .ia:first-child {
        margin-top: 0;
      }
      .idea {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 4px 0;
      }
      .idea a,
      .kath .k a,
      .prov a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        min-width: 44px;
        color: var(--carbon);
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .idea a {
        flex: 1;
      }
      .dn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        align-self: start;
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        font-size: 0;
        color: transparent;
      }
      .dn::before {
        content: "";
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--ink);
        background: transparent;
      }
      .dn[aria-pressed="true"]::before {
        background: var(--chop);
        border-color: var(--chop);
      }
      .dn[aria-pressed="true"]::after {
        content: "✓";
        position: absolute;
        left: 50%;
        top: 50%;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
        transform: translate(-50%, -50%);
      }
      .card.ink .dn[aria-pressed="true"]::after {
        animation: ink 160ms ease-out;
      }
      .card.flash {
        animation: flash 600ms linear;
      }
      .card.done .ttl,
      .card.done .mk,
      .card.done .pl,
      .card.done .tm,
      .card.done .tag,
      .card.done .ok,
      .card.done .sub,
      .card.done .trv {
        color: var(--mut);
      }
      .card.done .chip {
        color: var(--mut);
        border-color: var(--mut);
      }
      .late {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--rule);
      }
      .late .lh {
        font-size: 16px;
        font-weight: 700;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .go,
      .btns .act {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 12px;
        font-weight: 700;
      }
      .go {
        flex: 1 1 auto;
        background: var(--ink);
        color: var(--paper);
      }
      .btns .act {
        border: 1.5px solid var(--ink);
      }
      .note,
      .warn,
      .msg {
        font-size: 16px;
        line-height: 1.4;
        color: var(--mut);
      }
      .warn {
        color: var(--chop);
        font-weight: 600;
      }
      .empty {
        grid-column: 1 / -1;
        margin: 8px 0;
        padding: 16px 0;
        color: var(--mut);
        font-size: 16px;
      }
      .loose {
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
      }
      .kath {
        margin: 24px 0 0;
        padding-left: 12px;
        border-left: 2px solid var(--rule);
      }
      .kath summary,
      .kath .k {
        color: var(--mut);
      }
      .kath .k {
        padding: 8px 0;
        border-top: 1px solid var(--rule);
